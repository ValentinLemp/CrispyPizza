spring:
    datasource:
        url: ${DB_URL:jdbc:mysql://localhost:3306/crispy_pizza_commun}
        username: ${DB_USERNAME:root}
        password: ${DB_PASSWORD:root}
        driver-class-name: com.mysql.cj.jdbc.Driver
    jpa:
        hibernate:
            ddl-auto: none
        show-sql: true
        properties:
            hibernate:
                dialect: org.hibernate.dialect.MySQLDialect
                format_sql: true

datasource:
    ramillies:
        url: ${DB_URL_RAMILLIES:jdbc:mysql://localhost:3306/crispy_pizza_ramillies}
        username: ${DB_USERNAME:root}
        password: ${DB_PASSWORD:root}
        driver-class-name: com.mysql.cj.jdbc.Driver
    meux:
        url: ${DB_URL_MEUX:jdbc:mysql://localhost:3306/crispy_pizza_meux}
        username: ${DB_USERNAME:root}
        password: ${DB_PASSWORD:root}
        driver-class-name: com.mysql.cj.jdbc.Driver

mollie:
    api-key: ${MOLLIE_API_KEY:test_dHTwmurREUeeVEhpnxezuJT3678akn}

server:
    port: ${SERVER_PORT:8443}
    ssl:
        enabled: true
        key-store: classpath:keystore.p12
        key-store-password: ${SSL_PASSWORD:PizzaCrispyMeuxEtRamillies}
