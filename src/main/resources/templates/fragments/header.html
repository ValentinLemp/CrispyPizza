<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>
<!-- Navbar Fragment -->
<nav class="navbar" th:fragment="navbar">
    <div class="nav-container">
        <div class="nav-left">
            <div class="logo">
                <img th:src="@{/images/logoTemplate.png}" alt="CrispyPizza Logo">
            </div>
            <a href="tel:081340258" class="phone-link">081/340.258</a>
        </div>
        <ul class="nav-menu">
